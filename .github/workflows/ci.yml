name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # s10 の課題は、解答が間違っているとデッドロックしてテストが終わらないことがある
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: フォーマット確認
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (WASM)
        run: cargo clippy -p s17_wasm --target wasm32-unknown-unknown -- -D warnings
      - name: クリア済みステージのテスト
        run: |
          stages=$(grep -v '^\s*#' progress.txt | grep -v '^\s*$' || true)
          if [ -z "$stages" ]; then
            echo "progress.txt にステージがまだありません。"
            exit 0
          fi
          for s in $stages; do
            echo "::group::$s"
            cargo test -p "$s"
            echo "::endgroup::"
          done
